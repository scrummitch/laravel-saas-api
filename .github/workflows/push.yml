name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  laravel-tests:
    name: Test Laravel
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: ci
      DB_HOST: 127.0.0.1
      DB_CI_DATABASE: ci_plandalf
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, bcmath, curl, fileinfo, mysqli, pdo, pdo_mysql, gd, intl, sodium

      - name: Start MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE IF NOT EXISTS $DB_CI_DATABASE;" -u$DB_USERNAME -p$DB_PASSWORD

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --database=ci --force

      - name: Cache and un-cache routes
        run: php artisan route:cache && php artisan route:clear

      - name: Run Tests
        run: php artisan test
